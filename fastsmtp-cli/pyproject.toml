[project]
name = "fastsmtp-cli"
version = "0.5.2"
description = "Remote CLI client for FastSMTP server"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Senecal" }]
keywords = ["smtp", "email", "webhook", "cli", "fastsmtp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.14",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://jsenecal.github.io/fastsmtp/cli/fsmtp/"
Documentation = "https://jsenecal.github.io/fastsmtp/cli/fsmtp/"
Source = "https://github.com/jsenecal/fastsmtp"
Issues = "https://github.com/jsenecal/fastsmtp/issues"
Changelog = "https://github.com/jsenecal/fastsmtp/releases"

[project.scripts]
fsmtp = "fastsmtp_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastsmtp_cli"]
