[project]
name = "fastsmtp-workspace"
version = "0.7.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "bump-my-version>=1.5.1",
    "httpx>=0.28",
    "mypy>=1.19",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.21",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.15",
]
docs = [
    "zensical>=0.0.56",
]

[tool.uv.workspace]
members = ["fastsmtp", "fastsmtp-cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # Allow function calls in default arguments (FastAPI Depends pattern)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Both packages are gated, so `uv run mypy` with no arguments checks what CI
# checks. This says nothing about CLI/server agreement -- the client builds
# route strings and dict[str, Any] payloads that type-check no matter which
# route they hit. That contract is enforced by
# fastsmtp-cli/tests/test_api_contract.py against the live OpenAPI document.
files = ["fastsmtp/src/fastsmtp", "fastsmtp-cli/src/fastsmtp_cli"]
# Analyse the bodies of unannotated functions too. This does not require
# annotations (that would be disallow_untyped_defs, a much larger job); it just
# stops unannotated code from being silently skipped by the gate.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Neither ships stubs nor a py.typed marker, and no stub package exists for
# dkim or spf. types-aiobotocore exists but pulls a large generated tree in to
# type a single get_session() call. google-re2 (module re2) ships no py.typed
# marker either and has no stub package.
module = ["dkim", "spf", "aiobotocore.*", "re2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["fastsmtp/tests", "fastsmtp-cli/tests"]
markers = [
    "migrations: runs the Alembic chain against a throwaway database (deselect with -m 'not migrations')",
    "packaging: builds the distributions and inspects them (deselect with -m 'not packaging')",
]
# Turn a silent hang into a stack trace naming the test. The suite drives real
# servers, sockets and containers, so a hang is a realistic failure mode, and
# left unbounded it burns the whole GitHub Actions job timeout and reports
# nothing at all. Deliberately generous: a hang detector, not a slow-test
# policy. Every test but one finishes in under 5.2s; the exception carries its
# own marker (see test_match_regex_redos_protection).
timeout = 120
# Not the default, and load-bearing. The signal method arms a one-shot SIGALRM
# for the whole item, so once it has fired in the test body nothing is armed
# for teardown -- and teardown here shuts down uvicorn and exits the Postgres
# container, exactly where a wedged run would then hang silently a second time.
# The thread method exits the process outright after dumping every thread's
# stack, so the run always ends with a diagnostic, and the all-thread dump is
# what a deadlock needs to be readable.
timeout_method = "thread"
filterwarnings = [
    # A new DeprecationWarning is a signal, not scenery: fail the run instead of
    # letting it scroll past in the warnings summary. Later entries win over
    # earlier ones, so every known exception is listed below with the reason it
    # exists and the condition for deleting it.
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:aiosmtpd.*",
    # pyspf 2.0.14 (latest release, 2020) emits a SyntaxWarning (unescaped `\d`
    # in a docstring, spf.py:1724) and a DeprecationWarning (dns.resolver.query()
    # at spf.py:131). Both are fixed on upstream master via
    # https://github.com/sdgathman/pyspf/pull/43, but no release ships the fix yet
    # (tracked in https://github.com/sdgathman/pyspf/issues/45). Drop these two
    # filters once a pyspf release newer than 2.0.14 is available.
    # The SyntaxWarning is raised at compile time, where the warning's "module"
    # is the file path (not the import name), so the module pattern must match a
    # path ending in "spf" rather than the module name.
    "ignore::DeprecationWarning:spf.*",
    "ignore:invalid escape sequence:SyntaxWarning:.*spf",
    # uvicorn 0.40 still resolves its default ws="auto" to
    # uvicorn.protocols.websockets.websockets_impl, which imports
    # websockets.legacy and websockets.server.WebSocketServerProtocol -- both
    # deprecated by websockets 14.0 ahead of the legacy implementation's
    # removal. uvicorn already ships the replacement
    # (websockets_sansio_impl, selectable as ws="websockets-sansio", added for
    # https://github.com/encode/uvicorn/issues/1908) but has not made it the
    # default. Nothing here uses websockets: it arrives with the
    # uvicorn[standard] extra, and the conftest `serving` fixture starts a real
    # uvicorn server, so the import happens in the first test that does. Drop
    # both filters once a uvicorn release stops importing the legacy
    # implementation for ws="auto".
    # Matched on message rather than module -- the two warnings are raised from
    # different modules (websockets.legacy and uvicorn's impl) and the messages
    # are the stable part.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["fastsmtp", "fastsmtp_cli"]
branch = true
omit = [
    # tests/test_migrations.py runs the Alembic chain, but in a child process
    # this run does not trace, so measuring migrations only depresses the number.
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.bumpversion]
current_version = "0.7.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "v{new_version}"
message = "chore: bump version {current_version} -> {new_version}"
# uv.lock records the three workspace package versions. It is generated, and a
# plain search/replace would corrupt any dependency pinned at the same version
# as ours, so regenerate it with uv and stage the result instead.
allow_shell_hooks = true
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "fastsmtp/pyproject.toml"
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""
regex = true

[[tool.bumpversion.files]]
filename = "fastsmtp-cli/pyproject.toml"
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""
regex = true

[[tool.bumpversion.files]]
filename = "fastsmtp/src/fastsmtp/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "fastsmtp-cli/src/fastsmtp_cli/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
